# ----------------------------------------------------
# Configuration du Service et du Port (TP1 & TP3)
# ----------------------------------------------------
spring.application.name=doctor-service
server.port=8082

# ----------------------------------------------------
# Configuration de la Base de Données H2 (Corrigée)
# ----------------------------------------------------
# Utilisation d'une base de données en mémoire (in-memory)
spring.datasource.url=jdbc:h2:mem:doctordb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuration de Hibernate pour H2
# La valeur 'create' doit être seule sur la ligne.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
# Crée les tables à chaque démarrage (commentaire déplacé sur une ligne séparée)

# ----------------------------------------------------
# Console H2 (Utile pour vérifier les données)
# ----------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
