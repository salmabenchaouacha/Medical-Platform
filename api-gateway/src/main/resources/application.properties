# =======================================================
# 1. Configuration de l'Application et du Port
# =======================================================
server.port=8099
spring.application.name=api-gateway

# =======================================================
# 2. Configuration du Discovery Server (Eureka)
# =======================================================
# L'API Gateway sait où trouver l'Annuaire Interne (votre Discovery Server)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# =======================================================
# 3. Configuration des Routes (L'Accueil et le Routage)
#    Notez l'utilisation de lb://NOM_DU_SERVICE
# =======================================================

# --- Route 0: DOCTOR-SERVICE (Corrigée) ---
spring.cloud.gateway.routes[0].id=doctor_route
spring.cloud.gateway.routes[0].uri=lb://doctor-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/doctors/**
# AJOUTEZ CE FILTRE : Il transforme /doctors/hello en /api/doctors/hello
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/doctors/(?<segment>.*), /api/doctors/$\{segment}

# --- Route 2: User-Service ---
# --- Route 1: USER-SERVICE (Corrigée) ---
spring.cloud.gateway.routes[1].id=user_route

# URI : Utilise le nom exact du service dans Eureka (user-service)
spring.cloud.gateway.routes[1].uri=lb://user-service

# Predicate : Chemin d'entrée (ce que le client utilise)
# Le client utilisera /auth/login ou /auth/register via la Gateway.
spring.cloud.gateway.routes[1].predicates[0]=Path=/auth/**

# Filter : Réécriture du chemin vers le contrôleur.
# L'URL du client : http://localhost:8099/auth/login
# devient l'URL interne : http://user-service:8083/api/auth/login
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/auth/(?<segment>.*), /api/auth/$\{segment}

# Fichier : api-gateway/src/main/resources/application.properties

# --- Route 3: Appointment-Service (Corrigée) ---
spring.cloud.gateway.routes[2].id=appointment_route
# CORRECTION ICI : Utilisez les MAJUSCULES comme vu sur le tableau de bord Eureka
spring.cloud.gateway.routes[2].uri=lb://appointment-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/appointments/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/appointments/(?<segment>.*), /api/appointments/$\{segment}

# --- Route 4: Notification-Service (Souvent utilisé en interne, mais routons un point de test) ---
spring.cloud.gateway.routes[3].id=notification_route
spring.cloud.gateway.routes[3].uri=lb://notification-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/notifications/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/notifications/(?<segment>.*), /api/notifications/$\{segment}