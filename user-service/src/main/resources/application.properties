# Nom de l'application (Identique au nom sous lequel il s'enregistre)
spring.application.name=user-service

# Port d'exécution du microservice
server.port=8081

# H2 (in-memory)

spring.datasource.url=jdbc:h2:mem:usersdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# 1. Active l'enregistrement de ce service (true par défaut, mais explicite)
eureka.client.register-with-eureka=true

# 2. Active la récupération de la liste des services disponibles (true par défaut, mais explicite)
eureka.client.fetch-registry=true

# 3. Spécifie l'URL du Discovery Server (votre Eureka Server)
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

jwt.secret=Jv8GRMrRoW0NsXU6D0M+t+MMLH9bziAyZGY8ufYmrCI=

logging.level.org.springframework.http.converter.json=DEBUG

# Swagger / Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.medical.userservice=DEBUG