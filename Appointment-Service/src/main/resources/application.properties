spring.application.name=Appointment-Service
# Server Configuration
server.port=8089

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:appointmentdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console



# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Déclaration de l'Exchange (Optionnel mais bonne pratique)
# Ceci configure un Exchange Direct pour les événements
appointment.events.exchange=appointment.events.exchange


# Adresse où le service va tenter de s'enregistrer
eureka.client.service-url.defaultZone=http://localhost:8761/eureka